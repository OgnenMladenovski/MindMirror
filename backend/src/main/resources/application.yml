spring:
  application:
    name: mindmirror-backend
  datasource:
    # Prefer SPRING_DATASOURCE_URL (docker-compose). Otherwise build from DB_* parts
    # (Render supplies host/port/database/user/password from the managed Postgres).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mindmirror}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:mindmirror}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:mindmirror_dev_pw}}
  jpa:
    hibernate:
      ddl-auto: none   # Flyway owns the schema
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${BACKEND_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

mindmirror:
  jwt:
    secret: ${MINDMIRROR_JWT_SECRET:change-me-mindmirror-super-secret-key-please-rotate-in-prod}
    expiration-ms: ${MINDMIRROR_JWT_EXPIRATION_MS:86400000}
  ai:
    base-url: ${MINDMIRROR_AI_BASE_URL:http://localhost:8000}
    # High enough to survive a hosted AI-service cold start (Render free ~50s)
    # instead of failing with 503. Override with MINDMIRROR_AI_TIMEOUT_MS.
    timeout-ms: ${MINDMIRROR_AI_TIMEOUT_MS:60000}
  seed-demo: ${MINDMIRROR_SEED_DEMO:true}
  cors:
    allowed-origins: ${MINDMIRROR_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.mindmirror: INFO
